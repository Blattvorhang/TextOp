# @package _global_
defaults:
  - train_dar
  - _self_

task: refresh-goal-stats

# Recompute normalization and diagnostic distributions together from raw goals.
# Use the same dataset, sampling/goal configuration and seed to reproduce stats.
# Writes target_dir/goal_stats.pkl.
target_dir: null  # required

goal_clamp:
  time_min: 0.4

data:
  dof_dim: 29
  goal_type: joint_state
  goal_encoding: split_end_effector
  goal_per_primitive: true
  goal_offset_range: [-63, 0]
  goal_timestep_mode: relative
  # The task recomputes the stats explicitly; keep the dataset init from
  # loading (or silently caching) the datadir copy.
  load_goal_stats: false
  train:
    goal_clamp_time_min: ${goal_clamp.time_min}
    # Pool raw goals in this interval; do not average per-bin quantiles.
    # A height proxy only: no locomotion/action-label filtering is implied.
    goal_clamp_reference_height_range: [0.70, 0.775]
