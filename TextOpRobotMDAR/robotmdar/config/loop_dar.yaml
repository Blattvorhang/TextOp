# @package _global_
defaults:
  - vis_dar
  - _self_

task: loop-dar

# Generation settings
use_full_sample: true  # Use full DDPM sampling for better quality

# Required in body-goal mode when the controller does not provide keypoints.
goal_reference_path: null

# Override data settings for loop generation
data:
  goal_encoding: legacy40
  val:
    batch_size: 1  # Fixed batch size for loop generation
    split: none # No need to load data

denoiser:
  goal_encoding: ${data.goal_encoding}
