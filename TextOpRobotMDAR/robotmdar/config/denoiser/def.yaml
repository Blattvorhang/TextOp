_target_: robotmdar.model.mld_denoiser.DenoiserTransformer
h_dim: 512
ff_size: 1024
num_layers: 8
num_heads: 4
dropout: 0.1
activation: gelu
history_shape:
  - ${...data.history_len}
  - ${...nfeats}
noise_shape: [1, 128]
goal_dim: 5
grid_size: 25
cond_goal_root_mask_prob: 0.1
cond_goal_yaw_mask_prob: 0.0
cond_goal_time_mask_prob: 0.0
cond_goal_body_mask_prob: 0.0
cond_scene_mask_prob: 0.8
