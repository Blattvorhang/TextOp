# @package _global_
defaults:
  - base
  - train/dar
  - _self_

expname: BONES-SEED-FUTURE-64-ROT-MAT
task: train-dar

data:
  datadir: ./dataset/BONES-SEED-29dof-FULL-50fps
  # V6 joint_state targets the full-wrist G1 model directly.
  dof_dim: 29
  history_len: 16
  future_len: 64
  num_primitive: 3
  batch_size: 256
  weighted_sample: true
  preload_ram: true
  load_scene: false
  load_text_embeddings: true
  clip_version: ViT-B/32
  clip_dim: 512
  goal_type: joint_state
  goal_encoding: split
  goal_per_primitive: true
  goal_offset: 0
  # Arrival time disambiguates randomized targets, so training can cover every
  # future frame inside each primitive window.
  goal_offset_range: [-63, 0]
  goal_timestep_mode: relative
  goal_include_log_d_hor: false
  # Keep clean histories for the warm-up, then enable V7.1 history DR in the
  # dataloader. The server training launch may override this threshold.
  augmentation_enabled: true
  augmentation_start_step: 50000
  augmentation_prob: 0.5
  val:
    # Mirror training so validation measures the same randomized goal window.
    goal_offset_range: ${..goal_offset_range}

denoiser:
  goal_encoding: ${data.goal_encoding}
  goal_dim: 55
  text_condition_enabled: true
  cond_mask_prob:
    text: 0.2
    goal:
      position: 0.05
      velocity: 0.1
      orientation: 0.3
      joint: 0.6
      time: 0.1

train:
  manager:
    loss_weight:
      locomotion:
        rec: 1.0
        foot_contact: 0.01
        support_consistency: 1.0
        goal:
          g: 0.0
          root_position_hor: 0.5
          root_position_vert: 0.05
          root_velocity: 0.02
          root_orientation: 0.002
          joint_angle: 0.0
      getup:
        rec: 1.5
        foot_contact: 0.01
        support_consistency: 10.0
        goal:
          g: 0.01
          root_position_hor: 0.0
          root_position_vert: 0.05
          root_velocity: 0.002
          root_orientation: 0.0
          joint_angle: 0.0

ckpt:
  # For dof_dim=23 this resolves to the original long-horizon VAE. The 29-DoF
  # variant intentionally requires an explicit checkpoint override.
  vae: ${oc.select:data.dof_variants.dof${data.dof_dim}.vae_ckpt}

skeleton:
  asset:
    assetRoot: ./description/robots/g1/
