# @package _global_
defaults:
  - base
  - train/dar
  - _self_

expname: BONES-SEED-FUTURE-64-ROT-MAT
task: train-dar

data:
  datadir: ./dataset/BONES-SEED-29dof-FULL-50fps
  # V6 joint_state targets the full-wrist G1 model directly.
  dof_dim: 29
  history_len: 16
  future_len: 64
  num_primitive: 3
  batch_size: 256
  weighted_sample: true
  preload_ram: true
  load_scene: false
  load_text_embeddings: true
  clip_version: ViT-B/32
  clip_dim: 512
  goal_type: joint_state
  goal_encoding: split_end_effector
  goal_per_primitive: true
  goal_offset: 0
  # Arrival time disambiguates randomized targets, so training can cover every
  # future frame inside each primitive window.
  goal_offset_range: [-63, 0]
  goal_timestep_mode: relative
  # Keep clean histories for the warm-up, then enable V7.1 history DR in the
  # dataloader. The server training launch may override this threshold.
  augmentation_enabled: false
  augmentation_start_step: 50000
  augmentation_prob: 0.5
  val:
    # Mirror training so validation measures the same randomized goal window.
    goal_offset_range: ${..goal_offset_range}

denoiser:
  goal_encoding: ${data.goal_encoding}
  goal_dim: 66
  text_condition_enabled: false
  cond_mask_prob:
    # The two profiles are selected per sample from batch[pidx]["is_recovery"]
    locomotion:
      text: 1.0
      goal:
        position:
          hor: 0.05
          vert: 0.4
        velocity: 0.1
        orientation:
          rot6d: 0.4
          gravity: 0.4
        joint: 0.8
        end_effector:
          left_hand: 0.3
          right_hand: 0.3
          left_foot: 0.3
          right_foot: 0.3
        time: 0.1
      scene: 1.0
    getup:
      text: 1.0
      goal:
        position:
          hor: 0.95
          vert: 0.05
        velocity: 0.95
        orientation:
          rot6d: 0.95
          gravity: 0.05
        joint: 0.95
        end_effector:
          left_hand: 0.95
          right_hand: 0.95
          left_foot: 0.95
          right_foot: 0.95
        time: 0.1
      scene: 1.0

train:
  manager:
    loss_weight:
      locomotion:
        rec: 1.0
        foot_contact: 0.01
        support_consistency: 1.0
        goal:
          g: 0.0
          root_position_hor: 0.25
          root_position_vert: 0.01
          root_velocity: 0.02
          root_orientation: 0.0
          joint_angle: 0.0
          end_effector: 0.05
      getup:
        rec: 1.2
        foot_contact: 0.01
        support_consistency: 1.0
        goal:
          g: 0.0
          root_position_hor: 0.0
          root_position_vert: 0.0
          root_velocity: 0.0
          root_orientation: 0.0
          joint_angle: 0.0
          end_effector: 0.0

ckpt:
  # For dof_dim=23 this resolves to the original long-horizon VAE. The 29-DoF
  # variant intentionally requires an explicit checkpoint override.
  vae: ${oc.select:data.dof_variants.dof${data.dof_dim}.vae_ckpt}

skeleton:
  asset:
    assetRoot: ./description/robots/g1/
