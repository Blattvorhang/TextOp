# @package _global_
defaults:
  - base
  - train/dar
  - _self_
  # Select the condition/loss profile through Hydra. Rollout timing is
  # intentionally separate and remains controlled by train.manager.stages.
  - condition_stage: text_prior

expname: BONES-SEED-FUTURE-64-TEXT
task: train-dar

data:
  datadir: ./dataset/HIPHI-29dof-FULL-50fps
  # V6 joint_state targets the full-wrist G1 model directly.
  dof_dim: 29
  history_len: 16
  future_len: 64
  num_primitive: 3
  batch_size: 256
  weighted_sample: true
  preload_ram: true
  load_scene: false
  clip_version: ViT-B/32
  clip_dim: 512
  goal_type: joint_state
  goal_encoding: split_end_effector
  goal_per_primitive: true
  goal_offset: 0
  # Arrival time disambiguates randomized targets, so training can cover every
  # future frame inside each primitive window.
  goal_offset_range: [-63, 0]
  goal_timestep_mode: relative
  val:
    # Mirror training so validation measures the same randomized goal window.
    goal_offset_range: ${..goal_offset_range}

denoiser:
  goal_encoding: ${data.goal_encoding}
  goal_dim: 66

ckpt:
  # For dof_dim=23 this resolves to the original long-horizon VAE. The 29-DoF
  # variant intentionally requires an explicit checkpoint override.
  vae: ${oc.select:data.dof_variants.dof${data.dof_dim}.vae_ckpt}

skeleton:
  asset:
    assetRoot: ./description/robots/g1/
