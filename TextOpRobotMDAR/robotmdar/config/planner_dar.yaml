# @package _global_
defaults:
  - loop_dar
  - _self_

task: planner-dar

# Let SONIC consume the complete generated segment before replacing it.
# Resetting its frame-index cursor faster than the 8-frame / 50 Hz horizon
# repeatedly discards most of every reference and destabilizes tracking.
infer_period_ms: 500
motion_fps: 50.0
state_timeout_ms: 1
log_every: 20
pub_all_frames: false

# Keep the diffusion latent fixed across MPC updates. Nearby controller states
# should produce nearby plans instead of independent samples at every seam.
resample_noise_each_plan: false

# Experimental: seed the diffusion initial noise from a motion_lib clip.
# Set to a data/motion_lib/*.pkl path to enable; null (default) disables.
motion_path: null
# Starting frame index within the selected clip (raw frame, 0-based).
motion_start_frame: 0
# Clip name inside the pkl (required when pkl has >1 clip; auto-detected otherwise).
motion_clip: null

# Bootstrap from controller history once, then autoregress on generated history.
# Before each replan, translate the generated history endpoint to the measured
# G1 root position; local features and generated orientation remain unchanged.
use_generated_history: false

# Keep false while debugging pure autoregressive history. When enabled, the
# selected generated-history endpoint is translated onto the measured G1 root.
align_generated_history_to_g1: false

# Single-step denoising is the real-time path. Full diffusion can be enabled
# explicitly for offline experiments, but is not expected to meet the online
# segment cadence.
use_full_sample: false

comm_config: ${hydra:runtime.cwd}/robotmdar/config/communication/pubsub.yaml

# null means the current all-zero local occupancy condition.
occ_grid: null

data:
  dof_dim: 29
  goal_type: joint_state
  goal_encoding: split
  goal_per_primitive: true
  goal_offset_range: [-63, 0]
  goal_timestep_mode: relative
  history_len: 16
  future_len: 64
  load_goal_stats: false

denoiser:
  goal_encoding: ${data.goal_encoding}
  goal_dim: 45

# V6 uses the TextOp-style root orientation block. Dropping yaw is treated as
# dropping the whole orientation block for joint_state.
force_drop_goal_yaw: false
force_drop_goal_orientation: false
force_drop_goal_joint: false
force_drop_goal_velocity: false

# V6 arrival time is a separate positional encoding.
force_drop_goal_time: false

# Clamp the controller goal back into the training distribution before it is
# encoded: r_max(T) = clip(speed_max * clip(T, 1/fps, time_max), r_min, r_max).
# x, y are scaled proportionally when r exceeds the bound (direction preserved,
# z untouched); the same time cap feeds the urgency channels and the arrival
# PE. The envelope is DERIVED from the frozen goal_stats.pkl shipped with the
# checkpoint (quantile tables of the per-window ego goal distance and implied
# speed r/T): `quantile` is the training-distribution percentile to admit —
# lower is stricter. Derived: speed_max = speed quantile, r_max = distance
# quantile, r_min = speed_max/fps, time_max = future_len/fps. The stats must
# be written by the current dataset statistics pipeline; older goal_stats.pkl
# files without the quantile tables raise an error when enabled (refresh them
# with the refresh-goal-stats task). Disable at runtime with
# `goal_clamp_enabled=false` (or `goal_clamp=null`).
goal_clamp_enabled: false
goal_clamp:
  quantile: 99

# joint_state requires protocol-v5+ root pose, 29-DOF joint position, root
# velocity, and timestamp. No FK keypoint reference is needed.
goal_reference_path: null
