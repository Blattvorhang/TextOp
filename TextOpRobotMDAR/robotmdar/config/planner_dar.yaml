# @package _global_
defaults:
  - loop_dar
  - _self_

task: planner-dar

# Replan period and motion sampling.
infer_period_ms: 500
motion_fps: 50.0
state_timeout_ms: 1
log_every: 1
pub_all_frames: false

# Optional smoothing for measured joint history.
history_joint_smoothing:
  enabled: false
  max_velocity_rad_s: 10.0
  # 1.0 disables EMA smoothing.
  ema_alpha: 1.0

# Reuse diffusion noise across replans.
resample_noise_each_plan: false

# Optional motion-lib noise seed.
motion_path: null
motion_start_frame: 0
motion_clip: null

# Optional fixed recovery profile.
is_recovery: false

# Generated-history autoregressive chain.
generated_history:
  enabled: true
  # Project the switch frame using recent planner latency.
  latency_compensation: true
  latency_compensation_ema_alpha: 0.5
  latency_bias_ema_alpha: 0.2  # only for visualization; does not affect planning
  latency_plot_path: ${experiment_dir}/latency_compensation.png
  # null | spatial | residual_reanchor.
  align_to_g1: residual_reanchor
  # Replace the current state at a matched generated frame.
  phase_matching:
    enabled: false
    block_size: 8
# Single-step denoising.
use_full_sample: false

comm_config: ${hydra:runtime.cwd}/robotmdar/config/communication/pubsub.yaml

occ_grid: null

data:
  dof_dim: 29
  goal_type: joint_state
  goal_encoding: split_end_effector
  goal_per_primitive: true
  goal_offset_range: [-63, 0]
  goal_timestep_mode: relative
  goal_include_log_d_hor: false
  load_text_embeddings: false
  history_len: 16
  future_len: 64
  load_goal_stats: false

denoiser:
  goal_encoding: ${data.goal_encoding}
  goal_dim: 67

# Controller validity fields are passed to the denoiser as masks.

# Optional training-distribution goal clamp.
goal_clamp_enabled: false
goal_clamp:
  quantile: 99

# joint_state uses root pose, 29-DOF joints, velocity, and timestamp.
goal_reference_path: null
