# @package _global_
defaults:
  - loop_dar
  - _self_

task: planner-dar

# Let SONIC consume the complete generated segment before replacing it.
# Resetting its frame-index cursor faster than the 8-frame / 50 Hz horizon
# repeatedly discards most of every reference and destabilizes tracking.
infer_period_ms: 500
motion_fps: 50.0
state_timeout_ms: 1
log_every: 20
pub_all_frames: false

# Keep the diffusion latent fixed across MPC updates. Nearby controller states
# should produce nearby plans instead of independent samples at every seam.
resample_noise_each_plan: false

# Bootstrap from controller history once, then autoregress on generated history.
# Before each replan, translate the generated history endpoint to the measured
# G1 root position; local features and generated orientation remain unchanged.
use_generated_history: false

# Keep false while debugging pure autoregressive history. When enabled, the
# selected generated-history endpoint is translated onto the measured G1 root.
align_generated_history_to_g1: true

# Single-step denoising is the real-time path. Full diffusion can be enabled
# explicitly for offline experiments, but is not expected to meet the online
# segment cadence.
use_full_sample: false

comm_config: ${hydra:runtime.cwd}/robotmdar/config/communication/pubsub.yaml

# null means the current all-zero local occupancy condition.
occ_grid: null

data:
  goal_type: body_ext
  history_len: 16
  future_len: 64

denoiser:
  goal_dim: 21

# Root yaw is present on the wire for compatibility but is intentionally not
# used by the deployed V4 planner.
force_drop_goal_yaw: true

# The recommended V4 ablation keeps the 21-D layout but trains and deploys the
# remaining-time channel as zero. Relative timestamps remain on the wire for
# future checkpoints trained with goal_timestep_mode=relative.
force_drop_goal_time: true

# body_ext requires protocol-v5 world velocity, goal timestamp, and keypoints.
goal_reference_path: null
