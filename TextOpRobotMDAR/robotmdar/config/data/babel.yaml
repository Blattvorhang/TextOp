skeleton: ${..skeleton}

nfeats: 57 # 57 69 205 222 currently we hardcode here
dof_dim: 23
normalization_path: null
history_len: 2
future_len: 8
num_primitive: 4
batch_size: 512

weighted_sample: false
frame_weight: false
use_weighted_meanstd: false
load_text_embeddings: true
clip_version: ViT-B/32
clip_dim: 512
goal_offset: 0
goal_type: root
goal_per_primitive: false
occupancy_unit: 0.08

action_statistics_path: ./dataset/action_statistics_telemotion.json

# datadir: ./dataset/BABEL-AMASS-ROBOT
# datadir: ./dataset/BABEL-AMASS-ROBOT-23dof-FULL
# datadir: ./dataset/BABEL-AMASS-ROBOT-23dof-FULL-Modifier
# datadir: ./dataset/BABEL-TeleMotion-ROBOT-23dof-9770-Merged
# datadir: ./dataset/BABEL-AMASS-ROBOT-23dof-9770
# datadir: ./dataset/BABEL-TeleMotion-ROBOT-23dof-9770-100-Merged
# datadir: ./dataset/BABEL-TeleMotion-ROBOT-23dof-Full-300-Merged
# datadir: ./dataset/BABEL-TeleMotion-ROBOT-23dof-Full-1ANN-1000-Merged
# datadir: ./dataset/BABEL-AMASS-ROBOT-23dof-FULL-50fps
datadir: dataset/BABEL-TeleMotion-ROBOT-23dof-Full-1ANN-1000-Merged-Interp

common: &common
  _target_: robotmdar.dataloader.data.SkeletonPrimitiveDataset
  # datadir: ./dataset/BABEL-AMASS-ROBOT
  # datadir: ./dataset/BABEL-AMASS-ROBOT-23dof-FULL
  # datadir: ./dataset/BABEL-AMASS-ROBOT-23dof-FULL-Modifier
  # datadir: ./dataset/BABEL-TeleMotion-ROBOT-23dof-9770-Merged
  # datadir: ./dataset/BABEL-AMASS-ROBOT-23dof-9770
  # datadir: ./dataset/BABEL-TeleMotion-ROBOT-23dof-9770-100-Merged
  # datadir: ./dataset/BABEL-TeleMotion-ROBOT-23dof-Full-300-Merged
  datadir: ${..datadir}

  action_statistics_path: ${..action_statistics_path}

  robot_cfg: ${skeleton}
  device: cuda
  nfeats: ${..nfeats}
  dof_dim: ${..dof_dim}
  normalization_path: ${..normalization_path}
  history_len: ${..history_len}
  future_len: ${..future_len}
  num_primitive: ${..num_primitive}
  batch_size: ${..batch_size}
  weighted_sample: ${..weighted_sample}
  frame_weight: ${..frame_weight}
  use_weighted_meanstd: ${..use_weighted_meanstd}
  load_text_embeddings: ${..load_text_embeddings}
  clip_version: ${..clip_version}
  clip_dim: ${..clip_dim}
  goal_offset: ${..goal_offset}
  goal_type: ${..goal_type}
  goal_per_primitive: ${..goal_per_primitive}

train:
  <<: *common
  split: train

val:
  <<: *common
  split: val
