skeleton: ${..skeleton}

# Model-facing joint contract. Both variants read the same prepared 29-DoF
# motions; the dataset projects them to the legacy 23-DoF order when selected.
dof_dim: 29
dof_variants:
  dof23:
    nfeats: 57
    normalization_path: dataset/BONES-SEED-23dof-FULL-50fps/meanstd.pkl
    vae_ckpt: logs/pretrained/long_horizon_64/vae.pth
  dof29:
    nfeats: 69
    normalization_path: null
    vae_ckpt: null
nfeats: ${oc.select:data.dof_variants.dof${data.dof_dim}.nfeats}
normalization_path: ${oc.select:data.dof_variants.dof${data.dof_dim}.normalization_path}
history_len: 16
future_len: 64
num_primitive: 4
batch_size: 64

weighted_sample: false
frame_weight: false
use_weighted_meanstd: false
goal_offset: 0
goal_offset_range: null
goal_type: body
goal_per_primitive: false
goal_timestep_mode: relative
occupancy_unit: 0.08

# Planner V5 history augmentation (LDM-only). This explicit opt-in keeps VAE
# training clean even if a shared start-step override is supplied.
augmentation_enabled: false
augmentation_start_step: 50000
augmentation_prob: 0.5

action_statistics_path: ${.datadir}/action_statistics.json

datadir: dataset/BONES-SEED-29dof-FULL-50fps

common: &common
  _target_: robotmdar.dataloader.data.SkeletonPrimitiveDataset
  datadir: ${..datadir}

  action_statistics_path: ${..action_statistics_path}

  robot_cfg: ${skeleton}
  device: cuda
  nfeats: ${..nfeats}
  dof_dim: ${..dof_dim}
  normalization_path: ${..normalization_path}
  history_len: ${..history_len}
  future_len: ${..future_len}
  num_primitive: ${..num_primitive}
  batch_size: ${..batch_size}
  weighted_sample: ${..weighted_sample}
  frame_weight: ${..frame_weight}
  use_weighted_meanstd: ${..use_weighted_meanstd}
  goal_offset: ${..goal_offset}
  goal_offset_range: ${..goal_offset_range}
  goal_type: ${..goal_type}
  goal_per_primitive: ${..goal_per_primitive}
  goal_timestep_mode: ${..goal_timestep_mode}
  augmentation_start_step: ${..augmentation_start_step}
  augmentation_prob: ${..augmentation_prob}
  augmentation_enabled: ${..augmentation_enabled}

train:
  <<: *common
  split: train

val:
  <<: *common
  split: val
