skeleton: ${..skeleton}

# Model-facing joint contract. Both variants read the same prepared 29-DoF
# motions; the dataset projects them to the legacy 23-DoF order when selected.
feature_version: ${..feature_version}
dof_dim: 29
dof_variants:
  dof23:
    nfeats: 57
    normalization_path: dataset/BONES-SEED-23dof-FULL-50fps/meanstd.pkl
    vae_ckpt: logs/pretrained/long_horizon_64/vae.pth
  dof29:
    nfeats: 69
    normalization_path: null
    vae_ckpt: null
nfeats: ${oc.select:data.dof_variants.dof${data.dof_dim}.nfeats}
normalization_path: ${oc.select:data.dof_variants.dof${data.dof_dim}.normalization_path}
std_floor: 0.002  # doc §4.4: ~5th pct of v6 per-dim std (from meanstd_v6_dof29.pkl);
                  # floors near-constant channels (rot6d identity cols ~9e-4, dp_z ~1.3e-3)
history_len: 16
future_len: 64
num_primitive: 4
batch_size: 64

weighted_sample: false
frame_weight: false
use_weighted_meanstd: false
load_goal_stats: true
preload_ram: false
preload_num_workers: 8
load_scene: true
goal_offset: 0
goal_offset_range: null
goal_type: joint_state
goal_encoding: split
goal_per_primitive: true
goal_timestep_mode: relative
occupancy_unit: 0.08

# Planner V7.1 history augmentation (LDM-only). This explicit opt-in keeps VAE
# training clean even if a shared start-step override is supplied.
augmentation_enabled: false
augmentation_start_step: 50000
augmentation_prob: 0.5

# Scene conditioning curriculum (DAR training): before this global step the
# denoiser sees zeroed scene occupancy in training, eval and visualization
# to learn basic goal-driven locomotion; after it, the denoiser's
# cond_scene_mask_prob dropout applies (keeping some blank scenes). Set to 0
# to enable scenes from step 0.
scene_start_step: 50000

# Surface (motion-envelope) scene representation: keep only the obstacle
# boundary shell (occupancy XOR its 26-neighbourhood erosion) as the scene
# conditioning, in training, eval and visualization alike.
use_scene_surface: true

action_statistics_path: ${.datadir}/action_statistics.json

datadir: dataset/BONES-SEED-29dof-FULL-50fps

common: &common
  _target_: robotmdar.dataloader.data.SkeletonPrimitiveDataset
  datadir: ${..datadir}

  action_statistics_path: ${..action_statistics_path}

  robot_cfg: ${skeleton}
  device: cuda
  nfeats: ${..nfeats}
  dof_dim: ${..dof_dim}
  feature_version: ${..feature_version}
  std_floor: ${..std_floor}
  normalization_path: ${..normalization_path}
  history_len: ${..history_len}
  future_len: ${..future_len}
  num_primitive: ${..num_primitive}
  batch_size: ${..batch_size}
  weighted_sample: ${..weighted_sample}
  frame_weight: ${..frame_weight}
  use_weighted_meanstd: ${..use_weighted_meanstd}
  load_goal_stats: ${..load_goal_stats}
  preload_ram: ${..preload_ram}
  preload_num_workers: ${..preload_num_workers}
  load_scene: ${..load_scene}
  goal_offset: ${..goal_offset}
  goal_offset_range: ${..goal_offset_range}
  goal_type: ${..goal_type}
  goal_encoding: ${..goal_encoding}
  goal_per_primitive: ${..goal_per_primitive}
  goal_timestep_mode: ${..goal_timestep_mode}
  augmentation_start_step: ${..augmentation_start_step}
  augmentation_prob: ${..augmentation_prob}
  augmentation_enabled: ${..augmentation_enabled}

train:
  <<: *common
  split: train

val:
  <<: *common
  split: val
