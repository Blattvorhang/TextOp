skeleton: ${..skeleton}

nfeats: 69
history_len: 16
future_len: 64
num_primitive: 4
batch_size: 64

weighted_sample: false
frame_weight: false
use_weighted_meanstd: false
goal_offset: 0
goal_offset_range: null
goal_type: body
goal_per_primitive: false
occupancy_unit: 0.08

action_statistics_path: ${.datadir}/action_statistics.json

datadir: dataset/BONES-SEED-29dof-FULL-50fps

common: &common
  _target_: robotmdar.dataloader.data.SkeletonPrimitiveDataset
  datadir: ${..datadir}

  action_statistics_path: ${..action_statistics_path}

  robot_cfg: ${skeleton}
  device: cuda
  nfeats: ${..nfeats}
  history_len: ${..history_len}
  future_len: ${..future_len}
  num_primitive: ${..num_primitive}
  batch_size: ${..batch_size}
  weighted_sample: ${..weighted_sample}
  frame_weight: ${..frame_weight}
  use_weighted_meanstd: ${..use_weighted_meanstd}
  goal_offset: ${..goal_offset}
  goal_offset_range: ${..goal_offset_range}
  goal_type: ${..goal_type}
  goal_per_primitive: ${..goal_per_primitive}

train:
  <<: *common
  split: train

val:
  <<: *common
  split: val
